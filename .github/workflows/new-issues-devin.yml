name: Notify Devin Orchestrator on New Issue

on:
  issues:
    types: [opened]

jobs:
  notify-api:
    runs-on: ubuntu-latest
    steps:
      - name: Send POST request to Flask endpoint
        env:
          GLOBAL_ID: ${{ github.event.issue.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login }}
          URL: ${{ github.event.issue.html_url }}
          DESCRIPTION: ${{ github.event.issue.body }}
          CREATED_AT: ${{ github.event.issue.created_at }}
          LABELS: ${{ toJSON(github.event.issue.labels) }}
        run: |
          # Use jq to safely assemble the JSON payload
          PAYLOAD=$(jq -n \
            --argjson global_id "$GLOBAL_ID" \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg title "$TITLE" \
            --arg author "$AUTHOR" \
            --arg url "$URL" \
            --arg description "$DESCRIPTION" \
            --arg created_at "$CREATED_AT" \
            --argjson labels "$LABELS" \
            '{global_id: $global_id, issue_number: $issue_number, title: $title, author: $author, url: $url, description: $description, created_at: $created_at, labels: $labels}')
          
          curl -X POST "${{ vars.API_URL }}/api/issues/opened" \
            -u "${{ secrets.NGROK_USERNAME }}:${{ secrets.NGROK_PASSWORD }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
